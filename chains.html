 l:[["k","His order","Crowley and his deputy Karl Germer pushed out the lodge's leader; Parsons took over in 1942.",["agape"]],
    ["k","Married","Cameron married Parsons, a fellow Thelemite.",["cameronwiki"]],
    ["k","He cast her","Cameron played the Scarlet Woman in Anger's Inauguration of the Pleasure Dome (1954).",["pleasuredome","cameronwiki"]],
    ["k","He performed it","Anger played theremin, Butler guitar and electronics, in front of projections of Anger's films.",["laistskull","momaps1"]]],
 v:"<b>Every step personal.</b> The occult line into film and live AV runs through ritual magic, not Theosophy. It hands on rites to perform rather than pictures of the invisible."},

{t:"Magick to acid house",q:"How did occult technique reach British acid house?",
 n:[["Brion Gysin & William Burroughs","1959","People","c","Cut-ups (1959) and the Dreamachine (1961), treated as magical tools."],
    ["Genesis P-Orridge","1973","Person","c","Artist and magician; co-founds Throbbing Gristle in 1976."],
    ["Psychic TV & Thee Temple ov Psychick Youth","1981","Group","c","A band and a magical network side by side: sigils, cut-ups, Crowley."],
    ["Jack the Tab and Tekno Acid Beat","1988","Records","d","Acid house albums, in the year of Britain's rave explosion."]],
 l:[["k","Friends and teachers","P-Orridge befriended Burroughs and Gysin in London (1973); Burroughs taught him cut-ups and tape work.",["ebsn","realitystudio"]],
    ["k","Founded it","P-Orridge formed Psychic TV with Alex Fergusson in 1981, as Throbbing Gristle ended.",["ptvwiki"]],
    ["k","Made with a producer","P-Orridge made Jack the Tab with the producer Richard Norris: fake compilations to push the new sound (1988).",["ptvwiki","stranger","louder"]]],
 v:"<b>All first-hand.</b> The magic is method, not doctrine: cut-ups and sigils as techniques, carried by one artist from the Beat generation into acid house."},

{t:"From Theosophy to video art: Suzuki, Cage, Paik",q:"Did the Theosophical Society's Buddhist channel reach the first video artists?",
 n:[["D. T. & Beatrice Lane Suzuki","1920","People","o","Join the Theosophical Society in 1920; Zen teachers to the West."],
    ["John Cage","1951","Person","c","Composer: chance operations, the I Ching, silence."],
    ["Nam June Paik","1963","Person","a","Turns television sets into art."],
    ["Festival of Lights, Howard Wise Gallery, New York","1967","Event","a","A light-art show that adds TV works; video follows in 1969."]],
 l:[["k","Attended his classes","Cage attended Suzuki's classes at Columbia in the early 1950s.",["tricyclecage","enccage","suzuki"]],
    ["k","Met","Paik met Cage at the Darmstadt summer course in 1958 and changed course.",["artforumpaik","reynoldapaik"]],
    ["k","Exhibited there","Wise added Paik's TV works to the show, then staged TV as a Creative Medium (1969).",["sturkenfol"]]],
 v:"<b>All first-hand.</b> What crossed was Zen method; the Theosophy had fallen away by the time it reached chance music and the first video artist."},

{t:"From the light show to video art",q:"Where did the light-show makers go next?",
 n:[["Marshall McLuhan","1964","Person","c","Understanding Media; 'the global village'."],
    ["Timothy Leary","1966","Person","c","'Turn on, tune in, drop out'."],
    ["Rudi Stern","1966","Person","a","Painter turned light-projection artist, Leary's collaborator."],
    ["Global Village, New York","1969","Group","a","Video theatre: walls of monitors with live-switched tapes."],
    ["Vision and Television, Rose Art Museum","1970","Event","a","The first US museum exhibition of video."]],
 l:[["k","Advised him","Over lunch in New York (1966) McLuhan told Leary to sell LSD like an advertiser; the slogan followed.",["mcluhanleary"]],
    ["k","Worked together","Stern lived and worked with Leary for about two years and built his shows with Jackie Cassen.",["sternint"]],
    ["k","Co-founded it","Stern co-founded Global Village (1969), naming it after McLuhan, whom he had met at Millbrook.",["sternint","gvwiki"]],
    ["k","Exhibited there","Global Village built a walk-in monitor for the show, with a live operator switching inside.",["sternint","radsoft","londonchron"]]],
 v:"<b>All first-hand.</b> The New York light show led straight into video theatre: the same people, the same multi-screen thinking, now with cameras and monitors."},

{t:"From the ghost show to the first film show",q:"Did the Victorian ghost show lead to cinema?",
 n:[["Henry Langdon Childe","1838","Person","a","Lanternist: opens the Polytechnic with a 'grand phantasmagoria'; dissolving views; the chromatrope."],
    ["John Henry Pepper","1862","Person","a","Polytechnic lecturer and director; stages 'Pepper's Ghost' in Dickens's The Haunted Man."],
    ["The Polytechnic's optical theatre, Regent Street","1848–96","Venue","a","Built for giant lantern shows: 1,000 seats in two tiers, two shows a day."],
    ["Lumière Cinématographe","1896","Event","a","The first film show for a paying British audience."]],
 l:[["k","Same staff","Both worked at the Polytechnic for decades. Childe painted slides for its 1863 Cinderella under Pepper, and his apprentice W. R. Hill went to work for Pepper in 1867.",["childewiki","rpighosts"]],
    ["k","Ran it","Pepper joined in 1848, the year the theatre opened, and returned as managing director in 1861; the Ghost followed at Christmas 1862.",["mfpepper","wmoldcinema"]],
    ["k","Shown there","The Polytechnic rented the theatre to the Lumières. The magician Félicien Trewey showed the Cinématographe to the press on 20 February 1896 and to paying audiences the next day.",["wmoldcinema","wmcinemahist","smmlumiere"]]],
 v:"<b>All first-hand, through one building.</b> The ghost show didn't die out: it moved into the Polytechnic, where phantasmagoria, dissolving views and Pepper's Ghost played to the public that saw Britain's first paid films. Only the start is thin: Childe is said, not shown, to have worked for Philipsthal."},

{t:"From the spirit cabinet to Houdini",q:"Did the séance cabinet turn into escapology?",
 n:[["Ira & William Davenport","1864","People","o","Buffalo mediums, tied up inside a 'spirit cabinet' while instruments play; introduced as Spiritualists."],
    ["Harry Kellar","1869","Person","m","Their assistant, then business manager; later the 'Dean of American magicians'."],
    ["Harry Houdini","1910","Person","m","Escape artist. Meets Ira Davenport in 1910 and learns the rope tie from him; later the best-known enemy of fake mediums."],
    ["Arthur Conan Doyle","1920","Person","o","Spiritualist and author; his History of Spiritualism (1926) treats the Davenports as genuine."]],
 l:[["k","Worked for them","Kellar joined the brothers and William Fay in 1869, as assistant and then business manager, and picked up their rope tie. He left in 1873, taking Fay with him.",["kellarwiki","pbskellar","locira"]],
    ["k","His mentor","Houdini's hero and friend. In 1917 he coaxed Kellar out of retirement for a Hippodrome benefit and had him carried off stage in a sedan chair.",["pbskellar","ibmkellar"]],
    ["k","Friends, then enemies","They became friends over Spiritualism in 1920. In 1922 Lady Doyle 'contacted' Houdini's mother in automatic writing, in English, which his mother barely spoke. The friendship broke.",["pbsdoyle","vwdoyle","lithubdoyle"]]],
 v:"<b>All first-hand, and it comes full circle.</b> The spirit cabinet passed from mediums to magicians: Kellar carried the Davenports' rope tie into stage magic, and Houdini, who also met Ira himself, turned it into escapology and then against the mediums. Conan Doyle still believed the Davenports were real."},

{t:"From the spirit cabinet to the trick film",q:"How did a Spiritualist stage act lead to Méliès?",
 n:[["Ira & William Davenport","1865","People","o","Spirit-cabinet mediums on their British tour, with riots in Liverpool and Leeds."],
    ["John Nevil Maskelyne","1873","Person","m","Cheltenham magician; runs the Egyptian Hall, 'England's Home of Mystery', and writes against Spiritualism."],
    ["David Devant","1896","Person","m","Magician and shadowgraphist; buys Robert Paul's 35mm Theatrograph and shows films at the Egyptian Hall from 19 March 1896."],
    ["Georges Méliès","1896","Person","a","Owner of the Théâtre Robert-Houdin, Paris; turns a Paul projector into his first camera; pioneer of the trick film."]],
 l:[["w","Saw the act","Maskelyne said he saw through their cabinet séance at Cheltenham in March 1865 and built his own version. The local papers don't mention him, but the visit launched Maskelyne and Cooke.",["goulden","dbwiki"]],
    ["k","Hired him, then partners","Devant joined the Egyptian Hall company in 1893, replacing Charles Morritt, and became Maskelyne's partner in 1905.",["maskwiki","devantwiki","vcdevant"]],
    ["k","Sold him the projector","Devant sold Méliès Paul projectors in 1896; Méliès turned one into a camera, and in 1897 filmed Devant performing (D. Devant, Conjurer).",["smmmagic","vcdevant","ddconjurer"]]],
 v:"<b>One claim, then first-hand.</b> Only the Maskelyne family's account puts him in the room at Cheltenham. After that every step is a working relationship: the Egyptian Hall made Devant, and Devant put Paul's 35mm projector into the hands of the great pioneer of the trick film."},

{t:"From the magician's grandson to the city as a screen",q:"Did son et lumière lead to Jarre's city-sized light concerts?",
 n:[["Paul Robert-Houdin","1952","Person","a","Curator of Chambord and grandson of the magician Jean-Eugène Robert-Houdin; stages the world's first son et lumière there."],
    ["Maurice Jarre","1952","Person","a","Composer; scores the son et lumière shows at Chambord, Amboise and Avignon, then Lawrence of Arabia."],
    ["Jean-Michel Jarre","1968","Person","a","His son; joins Pierre Schaeffer's musique concrète lab, the GRM, in 1968."],
    ["Place de la Concorde, Paris","1979","Event","a","Bastille Day: synthesisers, giant projections on the buildings and fireworks, for about a million people."]],
 l:[["k","Wrote the music","The first son et lumière, at Chambord in 1952, had music by Maurice Jarre, played over a stereo set-up nobody had heard before.",["trcpaulrh","wikisel","goldmansel","operajarre"]],
    ["k","Father and son","Maurice left for the US when Jean-Michel was five, and they hardly met until he was 18. But a tape recorder of his father's started him on sound, and his father encouraged him to visit the GRM.",["wikijmj","qobuzjmj"]],
    ["k","Staged it","His first open-air concert: alone on stage with his synthesisers, with projections and fireworks. He says everything started from it.",["jmjconcorde","europe1jmj"]]],
 v:"<b>First-hand, but through an absent father.</b> The first son et lumière and Jarre's city-sized light concerts come out of one family: Maurice scored Chambord, and his son turned whole cities into the stage. No source here has Jean-Michel naming son et lumière as his model, so the family link is proven and the influence is an inference."}
];
// ---------- look ----------
const DOM={o:["Occult & Theosophy","#5b2a86"],c:["Counterculture & ideas","#c27a12"],m:["Stage magic","#7a5230"],a:["Light, film & AV","#2f6db5"],d:["Club culture","#c2185b"]};
const EV={k:["Met or worked together","#1D9E75",""],w:["Saw the work in person","#0e8fa0","10 6"],b:["Through a book","#8a8780","3 7"]};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let ci=0,step=0;
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080),st=$("stage");st.style.transform=`scale(${k})`;st.style.left=((innerWidth-1920*k)/2)+"px";st.style.top=((innerHeight-1080*k)/2)+"px";}
addEventListener("resize",fit);
$("pick").innerHTML=CH.map((c,i)=>`<option value="${i}">${i+1}. ${esc(c.t)}</option>`).join("");
$("legend").innerHTML=Object.values(EV).map(([t,c,da])=>`<span><svg width="40" height="12"><line x1="2" y1="6" x2="38" y2="6" stroke="${c}" stroke-width="4" stroke-dasharray="${da}" stroke-linecap="round"/></svg>${t}</span>`).join("")
 +`<span class="sep"></span>`+Object.values(DOM).map(([t,c])=>`<span><i style="background:${c}"></i>${t}</span>`).join("");
function draw(){
 const c=CH[ci],n=c.n.length,W=1920,M=80,G=n>=6?64:n===5?82:100,cw=Math.min(340,(W-2*M-(n-1)*G)/n),tot=n*cw+(n-1)*G,x0=(W-tot)/2;
 const pw=Math.min(cw+G-14,420),fs=n>=6?17:n===5?18.5:19.5,nfs=n>=6?24:27,CY=240+150,PT=590;
 $("title").textContent=c.t;$("q").textContent=c.q;$("count").textContent=`${ci+1} of ${CH.length}`;$("pick").value=ci;
 $("cards").innerHTML=c.n.map((d,i)=>{const col=DOM[d[3]][1];return `<div class="card${i>step?" dim":""}" style="left:${x0+i*(cw+G)}px;width:${cw}px"><div class="bar" style="background:${col}"></div><div class="tag">${esc(d[2])}</div><div class="yr" style="color:${col}">${esc(d[1])}</div><div class="nm" style="font-size:${nfs}px">${esc(d[0])}</div><div class="ln">${esc(d[4])}</div></div>`;}).join("");
 $("panels").innerHTML=c.l.map((l,i)=>{const [t,col]=EV[l[0]],cx=x0+i*(cw+G)+cw+G/2;return `<div class="lp${i>=step?" hide":""}" style="left:${cx-pw/2}px;width:${pw}px;border-top-color:${col}"><div class="ev" style="color:${col}">${i+1} · ${t}</div><div class="hd">${esc(l[1])}</div><div class="tx" style="font-size:${fs}px">${esc(l[2])}</div><div class="src">${l[3].filter(k=>S[k]).map(k=>`<a href="${S[k][1]}" target="_blank" rel="noopener">${esc(S[k][0])}</a>`).join("")}</div></div>`;}).join("");
 let svg="<defs>"+Object.entries(EV).map(([k,[t,col]])=>`<marker id="ah${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`).join("")+"</defs>";
 c.l.forEach((l,i)=>{const [t,col,da]=EV[l[0]],x1=x0+i*(cw+G)+cw+4,x2=x0+(i+1)*(cw+G)-6,cx=(x1+x2)/2,op=i>=step?0:1;
  svg+=`<g opacity="${op}" style="transition:opacity .35s"><line x1="${x1}" y1="${CY}" x2="${x2}" y2="${CY}" stroke="${col}" stroke-width="5" stroke-dasharray="${da}" stroke-linecap="round" marker-end="url(#ah${l[0]})"/>`
   +`<line x1="${cx}" y1="${CY+18}" x2="${cx}" y2="${PT}" stroke="${col}" stroke-width="2" stroke-dasharray="2 5" opacity=".7"/>`
   +`<circle cx="${cx}" cy="${CY}" r="17" fill="#fff" stroke="${col}" stroke-width="3"/><text x="${cx}" y="${CY+6.5}" text-anchor="middle" font-size="18" font-weight="700" fill="${col}">${i+1}</text></g>`;});
 $("links").innerHTML=svg;
 $("verdict").innerHTML=c.v;$("verdict").className=step>=n-1?"":"hide";
 $("bprev").disabled=step<=0;$("bnext").disabled=step>=n-1;
 try{history.replaceState(null,"","#"+(ci+1));}catch(e){}}
function setChain(i,all){ci=(i+CH.length)%CH.length;step=all?CH[ci].n.length-1:0;draw();}
function move(d){const n=CH[ci].n.length;step=Math.max(0,Math.min(n-1,step+d));draw();}
$("pick").onchange=e=>{setChain(+e.target.value,true);e.target.blur();};
$("bstart").onclick=()=>{step=0;draw();};$("bprev").onclick=()=>move(-1);$("bnext").onclick=()=>move(1);
function full(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}
$("bfull").onclick=full;
addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;
 if(["ArrowRight"," ","PageDown"].includes(e.key)){e.preventDefault();move(1);}
 else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();move(-1);}
 else if(e.key==="ArrowDown"){e.preventDefault();setChain(ci+1,true);}
 else if(e.key==="ArrowUp"){e.preventDefault();setChain(ci-1,true);}
 else if(e.key==="Home"){step=0;draw();}
 else if(e.key==="End"){step=CH[ci].n.length-1;draw();}
 else if(e.key==="f"||e.key==="F")full();});
const h=parseInt((location.hash||"").slice(1),10);
fit();setChain(h>=1&&h<=CH.length?h-1:0,true);
</script>
