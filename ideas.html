    {id:"las",yr:"1925–26",nm:"László and Fischinger",k:"av",tx:"Alexander László's colour-light piano concerts; Fischinger's films were added in March 1926, then his own three-projector shows.",src:["cvmraum"]},
    {id:"vor",yr:"1957–59",nm:"Belson and Jacobs' Vortex",k:"av",tx:"Electronic music with abstract projections on the Morrison Planetarium dome, San Francisco.",src:["belson"]},
    {id:"jen",yr:"1967",nm:"Jenny's Cymatics",k:"sci",tx:"Hans Jenny, an Anthroposophist, films sound shaping sand, pastes and liquids, and names it cymatics.",src:["jenny","cymwiki"]},
    {id:"ata",yr:"1977",nm:"Atari Video Music",k:"av",tx:"The first commercial electronic music visualiser, by Bob Brown of home Pong: plug in the stereo, watch patterns on the TV.",src:["atariwiki"]},
    {id:"viz",yr:"1993–",nm:"Visualisers and VJs",k:"av",tx:"Software visualisers from Cthugha (1993) to iTunes; the VJ plays them live in clubs.",src:["musvizwiki"]}],
 l:[["new","cas","p","The same colour–note analogy."],
    ["cas","rim","p","Colour organs again, built anew."],
    ["chl","tfm","d","Thought-Forms offers Chladni plates as physical proof.",["tfchladni"]],
    ["tfm","kan","d","Ringbom traced Kandinsky's forms to Thought-Forms; Kupka drew on its plates.",["ringbom","wikikupka"]],
    ["rim","las","p","Colour-light concerts again."],
    ["las","vor","d","Belson saw Fischinger's films at Art in Cinema (1946) and turned to the moving abstract image.",["belson"]],
    ["chl","jen","c","Cymatics revives Chladni's figures.",["cymwiki"]],
    ["vor","ata","p","Abstract light to music, now in a box for the home."],
    ["ata","viz","p","The first of many."]],
 v:"<b>Science first, then spirit, then the living room.</b> Colour organs and Chladni's figures began as physics. Theosophy's 'forms built by music' gave them a spiritual meaning that reached Kandinsky and Kupka, and abstract film carried the forms on. By 1977 a Pong engineer had put music visualisation in the home, with no doctrine at all."}
];
// ---------- look ----------
const KIND={sci:["Science & philosophy","#3f7f6e"],occ:["Occult & Theosophy","#5b2a86"],art:["Art & ideas","#c27a12"],av:["Light, film & AV","#2f6db5"],show:["Shows & magic","#7a5230"]};
const EV={d:["Took it from","#1D9E75","","documented"],c:["Likely","#0e8fa0","10 6","same circle or context"],p:["Same idea","#8a8780","2 7","no hand-over shown"]};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let ii=0,step=0,flat=false,lastDrag=-1e9,K=1,cards=[],nodes=[],lines=[],thread=null;
function fit(){K=Math.min(innerWidth/1920,innerHeight/1080);const st=$("stage");st.style.transform=`scale(${K})`;st.style.left=((innerWidth-1920*K)/2)+"px";st.style.top=((innerHeight-1080*K)/2)+"px";}
addEventListener("resize",fit);
$("pick").innerHTML=ID.map((c,i)=>`<option value="${i}">${i+1}. ${esc(c.t)}</option>`).join("");
$("legend").innerHTML=Object.values(EV).map(([t,c,da,sub])=>`<span><svg width="38" height="12"><line x1="2" y1="6" x2="36" y2="6" stroke="${c}" stroke-width="4" stroke-dasharray="${da}" stroke-linecap="round"/></svg>${t} <span style="color:#a3a198">(${sub})</span></span>`).join("")
 +`<span class="sep"></span>`+Object.values(KIND).map(([t,c])=>`<span><i style="background:${c}"></i>${t}</span>`).join("");
const srcs=k=>(k||[]).filter(x=>S[x]).map(x=>`<a href="${S[x][1]}" target="_blank" rel="noopener">${esc(S[x][0])}</a>`).join("");
// ---------- 3D ----------
// Overview: the whole lineage as a ribbon of cards turned in space (drag to turn it).
// Stepping: a tunnel looking back through time; the current moment at the front, earlier ones receding, later ones hidden.
// Flat: the same ribbon, face on.
const F=780,ZOFF=700,DZ=200,RX=420,RY=170,CX=960,CY=430,DT=2*Math.PI/5.2;   // tunnel
const RD=1500,PSI0=0.36,BOX=[92,1828,246,716];                              // ribbon
let cam=0,camT=0,rot=Math.PI/2,rotT=Math.PI/2,psi=PSI0,psiB=PSI0,vw=0,FIT={s:1,ox:0,oy:0};
function spF(n){return Math.min(165,1480/Math.max(1,n-1));}
const rowY=i=>(i%2?95:-95);
function ribRaw(t,n){const X=(t-(n-1)/2)*spF(n),lo=Math.floor(t),fr=t-lo,Y=rowY(lo)*(1-fr)+rowY(Math.min(lo+1,n-1))*fr,
 x1=X*Math.cos(psi),z1=X*Math.sin(psi),k=RD/(RD-z1);return {x:x1*k,y:Y*k,k,z:z1};}
function fitRibbon(n){let L=1e9,R=-1e9,T=1e9,B=-1e9;
 for(let i=0;i<n;i++){const p=ribRaw(i,n);L=Math.min(L,p.x-118*p.k);R=Math.max(R,p.x+118*p.k);T=Math.min(T,p.y-48*p.k);B=Math.max(B,p.y+48*p.k);}
 const s=Math.min(1,(BOX[1]-BOX[0])/(R-L),(BOX[3]-BOX[2])/(B-T));
 FIT={s,ox:(BOX[0]+BOX[1])/2-s*(L+R)/2,oy:(BOX[2]+BOX[3])/2-s*(T+B)/2};}
function pos(t,n){
 const r=ribRaw(t,n),rx=FIT.ox+FIT.s*r.x,ry=FIT.oy+FIT.s*r.y,rk=FIT.s*r.k;
 const th=t*DT+rot,d=(cam-t)*DZ+ZOFF,tk=F/Math.max(d,60),tx=CX+RX*Math.cos(th)*tk,ty=CY+RY*Math.sin(th)*tk;
 return {x:rx*(1-vw)+tx*vw,y:ry*(1-vw)+ty*vw,k:rk*(1-vw)+tk*vw,d,z:r.z,rk};}
function build(){
 const c=ID[ii];
 $("cards").innerHTML=c.n.map((d,i)=>{const col=KIND[d.k][1];return `<div class="card${d.mem?" mem":""}" data-i="${i}"><div class="bar" style="background:${col}"></div><div class="yr" style="color:${col}">${esc(d.yr)}</div><div class="nm">${esc(d.nm)}</div></div>`;}).join("");
 cards=[...document.querySelectorAll("#cards .card")];
 let svg="<defs>"+Object.entries(EV).map(([k,[t,col]])=>`<marker id="ah${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`).join("")+"</defs>";
 svg+=`<path id="thr" fill="none" stroke="#d6d3c9" stroke-width="3" stroke-linecap="round"/>`;
 svg+=c.l.map((l,i)=>{const [t,col,da]=EV[l[2]];return `<path data-l="${i}" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="${da}" stroke-linecap="round"${l[2]!=="p"?` marker-end="url(#ah${l[2]})"`:""}/>`;}).join("");
 $("threads").innerHTML=svg;thread=$("thr");lines=[...$("threads").querySelectorAll("path[data-l]")];
}
function vis(i,p,n,kmin,kmax,feed){
 const cur=step-1,df=cam-i;
 const rib=flat?(step>0&&i>cur?0.14:1):0.62+0.38*(kmax>kmin?(p.rk-kmin)/(kmax-kmin):1);
 // in the tunnel: the moment just reached and the two before it are clear, older ones fade out,
 // except a moment that feeds the current one, which stays visible
 const near=Math.max(0,Math.min(1,df+1)),far=Math.max(feed?0.9:0,Math.min(1,1-(df-2.5)/2));
 return rib*(1-vw)+near*far*vw;}
function frame(){
 const c=ID[ii],n=c.n.length,now=performance.now(),a=RM?1:0.085,cur=step-1;
 const vT=(flat||step===0)?0:1;
 if(!flat&&step===0&&!RM&&now-lastDrag>3000)psiB+=(PSI0-psiB)*0.01;      // drift back to the resting angle
 const psiT=flat?0:psiB+(!RM&&step===0&&!flat?0.07*Math.sin(now/2300):0);
 psi+=(psiT-psi)*a;cam+=(camT-cam)*a;rot+=(rotT-rot)*a;vw+=(vT-vw)*(RM?1:0.075);
 fitRibbon(n);
 const P=c.n.map((d,i)=>pos(i,n)),ks=P.map(p=>p.rk),kmin=Math.min(...ks),kmax=Math.max(...ks),
  feeds=new Set(step>0?c.l.filter(l=>l[1]===c.n[cur].id).map(l=>l[0]):[]),O=P.map((p,i)=>vis(i,p,n,kmin,kmax,feeds.has(c.n[i].id)));
 // thread through time
 let pts=[];for(let t=0;t<=n-1+1e-6;t+=0.1){if(vw>0.5&&t>cam+0.05)break;if(vw>0.5&&cam-t>4.6)continue;const p=pos(t,n);pts.push(p.x.toFixed(1)+","+p.y.toFixed(1));}
 thread.setAttribute("d",pts.length>1?"M"+pts.join(" L"):"");thread.setAttribute("opacity",(0.45+0.55*vw).toFixed(2));
 // cards
 P.forEach((p,i)=>{const el=cards[i],op=O[i],s=p.k*(i===cur&&vw>0.5?1.06:1);
  el.style.transform=`translate(${(p.x-118).toFixed(1)}px,${(p.y-38).toFixed(1)}px) scale(${s.toFixed(3)})`;
  el.style.opacity=op.toFixed(3);
  el.style.zIndex=String(vw>0.5?Math.round(4000-p.d)+(i===cur?500:0):Math.round(2000+p.z)+(i===cur?500:0));
  el.style.pointerEvents=op<0.1?"none":"auto";el.classList.toggle("sel",i===cur);});
 // links
 c.l.forEach((l,i)=>{const a=c.n.findIndex(d=>d.id===l[0]),b=c.n.findIndex(d=>d.id===l[1]),A=P[a],B=P[b];
  const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;
  // on the ribbon, a link between two cards in the same row arcs outside the row
  const same=a%2===b%2&&Math.abs(a-b)>=2,lift=same?(a%2?1:-1)*(46+len*0.1)*(1-vw):0;
  let x1,y1,x2,y2;
  if(same&&vw<0.5){x1=A.x+Math.sign(dx)*40*A.k;y1=A.y+Math.sign(lift)*40*A.k;x2=B.x-Math.sign(dx)*40*B.k;y2=B.y+Math.sign(lift)*44*B.k;}
  else{const ca=Math.min(len*0.36,60*A.k),cb=Math.min(len*0.36,60*B.k);x1=A.x+dx/len*ca;y1=A.y+dy/len*ca;x2=B.x-dx/len*cb;y2=B.y-dy/len*cb;}
  const mx=(x1+x2)/2-dy/len*16,my=(y1+y2)/2+dx/len*16+lift*1.6;
  lines[i].setAttribute("d",`M${x1.toFixed(1)},${y1.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`);
  let op=Math.min(O[a],O[b]);if(step>0&&b===cur)op=Math.max(op,0.95);else if(step>0)op*=0.55;
  lines[i].setAttribute("opacity",op.toFixed(3));lines[i].setAttribute("stroke-width",step>0&&b===cur?6:4);});
 requestAnimationFrame(frame);}
function aim(){// in the tunnel, bring the current moment to the front, bottom centre
 if(step===0)return;const i=step-1;camT=i;let target=Math.PI/2-i*DT;target+=Math.round((rot-target)/(2*Math.PI))*2*Math.PI;rotT=target;}
// ---------- panel ----------
function panel(){
 const c=ID[ii];
 if(step===0){return `<div class="pn l"><div class="ev">The whole idea · ${c.n.length} moments</div><div class="h">${esc(c.t)}</div><div class="tx">${esc(c.q)} Step through with ▶, or click any card.</div></div>`
  +`<div class="pn r"><div class="ev">How to read the links</div>`+Object.values(EV).map(([t,col,da,sub])=>`<div class="lk"><i style="background:${col}">${t}</i>${sub}</div>`).join("")+`<div class="lk" style="color:#8a8780">Cards marked 'from memory' have no source on this page yet.</div></div>`;}
 const i=step-1,d=c.n[i],col=KIND[d.k][1];
 const inc=c.l.filter(l=>l[1]===d.id),out=c.l.filter(l=>l[0]===d.id);
 const nm=id=>esc(c.n.find(x=>x.id===id).nm);
 let r=inc.length?inc.map(l=>{const [t,cl]=EV[l[2]];return `<div class="lk"><i style="background:${cl}">${t}</i>from <b>${nm(l[0])}</b>: ${esc(l[3])}${l[4]?`<span class="lks">${srcs(l[4])}</span>`:""}</div>`;}).join(""):`<div class="lk" style="color:#8a8780">No earlier moment on this page is linked to it.</div>`;
 if(out.length)r+=`<div class="lk" style="color:#6b6a65">Passes to: ${out.map(l=>`<b>${nm(l[1])}</b>`).join(", ")}</div>`;
 return `<div class="pn l" style="border-top-color:${col}"><div class="ev" style="color:${col}">${esc(d.yr)} · ${KIND[d.k][0]}${d.mem?" · from memory":""}</div><div class="h">${esc(d.nm)}</div><div class="tx">${esc(d.tx)}</div><div class="src">${srcs(d.src)}</div></div>`
  +`<div class="pn r" style="border-top-color:${inc.length?EV[inc[0][2]][1]:"#c9c6bc"}"><div class="ev">How it arrived</div>${r}</div>`;}
function draw(){
 const c=ID[ii],n=c.n.length;
 $("title").textContent=`${ii+1} · ${c.t}`;$("q").textContent=c.q;$("count").textContent=`${ii+1} of ${ID.length}`;$("pick").value=ii;
 $("panel").innerHTML=panel();$("verdict").innerHTML=c.v;$("verdict").className=(step===0||step>=n)?"":"hide";
 $("bprev").disabled=step<=0;$("bnext").disabled=step>=n;$("bflat").textContent=flat?"3D":"Flat";
 aim();
 try{history.replaceState(null,"","#"+(ii+1));}catch(e){}}
function setIdea(i){ii=(i+ID.length)%ID.length;step=0;cam=camT=0;rot=rotT=Math.PI/2;psiB=PSI0;build();draw();}
function move(dlt){const n=ID[ii].n.length;step=Math.max(0,Math.min(n,step+dlt));draw();}
$("pick").onchange=e=>{setIdea(+e.target.value);e.target.blur();};
$("bstart").onclick=()=>{step=0;draw();};$("bprev").onclick=()=>move(-1);$("bnext").onclick=()=>move(1);
$("bflat").onclick=()=>{flat=!flat;draw();};
function full(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}
$("bfull").onclick=full;
// drag to turn; click a card to focus
let drag=null;
$("stage").addEventListener("pointerdown",e=>{if(e.target.closest("#top,#panel,#verdict,#legend"))return;drag={x:e.clientX,y:e.clientY,moved:false,card:e.target.closest(".card")};});
addEventListener("pointermove",e=>{if(!drag)return;const dx=(e.clientX-drag.x)/K,dy=(e.clientY-drag.y)/K;if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true;$("scene").classList.add("drag");}
 if(drag.moved){if(vw>0.5){rotT+=(dx*0.006+dy*0.004);rot=rotT;}else if(!flat){psiB=Math.max(-0.75,Math.min(0.75,psiB+dx*0.0022));}drag.x=e.clientX;drag.y=e.clientY;lastDrag=performance.now();}});
addEventListener("pointerup",()=>{if(drag&&!drag.moved&&drag.card){step=+drag.card.dataset.i+1;draw();}drag=null;$("scene").classList.remove("drag");});
addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;
 if(["ArrowRight"," ","PageDown"].includes(e.key)){e.preventDefault();move(1);}
 else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();move(-1);}
 else if(e.key==="ArrowDown"){e.preventDefault();setIdea(ii+1);}
 else if(e.key==="ArrowUp"){e.preventDefault();setIdea(ii-1);}
 else if(e.key==="Home"){step=0;draw();}
 else if(e.key==="End"){step=ID[ii].n.length;draw();}
 else if(e.key==="v"||e.key==="V"){flat=!flat;draw();}
 else if(e.key==="f"||e.key==="F")full();});
const hh=parseInt((location.hash||"").slice(1),10);
fit();setIdea(hh>=1&&hh<=ID.length?hh-1:0);requestAnimationFrame(frame);
}
</script>
