<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esoteric sources of the avant-garde: a network, 1840s–1990s</title>
<style>
:root{--text-primary:#1f1e1c;--text-secondary:#6b6a65;--surface-1:#ffffff;--bg-neutral:#f1efe8;--border:#d3d1c7}
body{margin:0;padding:12px 16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--surface-1);color:var(--text-primary)}
h1{font-size:20px;font-weight:500;margin:0 0 6px}
#net text.n{font-size:11.5px;fill:var(--text-primary);pointer-events:none;paint-order:stroke;stroke:var(--surface-1);stroke-width:4px;stroke-linejoin:round}
#net text.hub{font-size:13.5px;font-weight:500}
#net text.band{font-size:14px;font-weight:500;fill:var(--text-secondary)}
#net rect.bg{fill:var(--bg-neutral);opacity:.6}
#net line{stroke:var(--text-secondary);cursor:pointer}
#net line.on{stroke:var(--text-primary);stroke-opacity:1!important}
#net circle{stroke:var(--surface-1);stroke-width:2;cursor:grab}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--text-secondary);margin:4px 0}
.row label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.row i{width:10px;height:10px;border-radius:50%;display:inline-block}
.row b{font-weight:500;color:var(--text-primary);margin-right:4px}
#cap{position:sticky;top:0;background:var(--surface-1);font-size:14px;color:var(--text-secondary);min-height:22px;padding:6px 0;z-index:2;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<h1>Esoteric sources of the avant-garde, 1840s–1990s</h1>
<div class="row" id="lay"><b>Layers</b></div>
<div class="row"><b>Links</b>
<label><input type="checkbox" checked disabled> Met / worked together (solid)</label>
<label><input type="checkbox" id="gT" checked> Same group / corresponded / supported (dashed)</label>
<label><input type="checkbox" id="iT" checked> Influence only (dotted)</label>
</div>
<div id="cap">Hover or tap a line to see the link. Drag people sideways within their period.</div>
<svg id="net" width="100%" viewBox="0 0 1000 3340"></svg>
<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const {CAT,N,E}=window.NETDATA;
const on={};Object.keys(CAT).forEach(k=>on[k]=true);
const BH=[130,330,320,270,280,460,800,690],LAB=["Precursors & early Victorian (to 1860)","High Victorian (1860–1900)","Edwardian & pre-war (1900–1918)","Post-WW1: the 1920s","Inter-war: the 1930s","War & post-WW2: 1940s–50s","1960s & 70s","1980s & 90s: post-punk, industrial & rave"];
const BY=[];let yy=20;BH.forEach(h=>{BY.push(yy);yy+=h+12;});
const TY=BY.map((y,i)=>y+BH[i]/2+12),W=1000;
const all=N.map(d=>({id:d[0],g:d[1],e:d[2],hub:d[3]||0}));
const byId=Object.fromEntries(all.map(n=>[n.id,n]));
const allL=E.map(e=>({s:e[0],t:e[1],k:e[2],txt:e[3]}));
const svg=d3.select("#net"),cap=document.getElementById("cap");
BY.forEach((y,i)=>{svg.append("rect").attr("class","bg").attr("x",0).attr("y",y).attr("width",W).attr("height",BH[i]).attr("rx",12);svg.append("text").attr("class","band").attr("x",14).attr("y",y+22).text(LAB[i]);});
const LG=svg.append("g"),NG=svg.append("g");
const lay=document.getElementById("lay");
Object.entries(CAT).forEach(([k,[name,col]])=>{const lb=document.createElement("label");lb.innerHTML=`<input type="checkbox" checked data-k="${k}"><i style="background:${col}"></i>${name}`;lay.appendChild(lb);});
lay.addEventListener("change",e=>{if(e.target.dataset.k){on[e.target.dataset.k]=e.target.checked;build();}});
document.getElementById("gT").onchange=build;document.getElementById("iT").onchange=build;
const sim=d3.forceSimulation().force("charge",d3.forceManyBody().strength(-160)).force("collide",d3.forceCollide(d=>d.hub?32:24)).force("x",d3.forceX(W/2-50).strength(0.04)).force("y",d3.forceY(d=>TY[d.e]).strength(0.6));
let lsel,gsel;
function build(){
 const sg=document.getElementById("gT").checked,si=document.getElementById("iT").checked;
 const nodes=all.filter(n=>on[n.g]);const vis=new Set(nodes.map(n=>n.id));
 const links=allL.filter(l=>vis.has(l.s)&&vis.has(l.t)&&(l.k==="d"||(l.k==="g"&&sg)||(l.k==="i"&&si))).map(l=>({source:byId[l.s],target:byId[l.t],k:l.k,txt:l.txt}));
 lsel=LG.selectAll("line").data(links,d=>d.source.id+"|"+d.target.id+"|"+d.k).join("line")
  .attr("stroke-width",d=>d.k==="d"?1.9:1.3).attr("stroke-dasharray",d=>d.k==="g"?"6 5":d.k==="i"?"1 5":null).attr("stroke-linecap","round").attr("stroke-opacity",d=>d.k==="d"?0.8:0.55)
  .on("mouseenter click",function(e,d){lsel.classed("on",false);d3.select(this).classed("on",true);cap.textContent=d.source.id+" — "+d.target.id+": "+d.txt;});
 gsel=NG.selectAll("g.nd").data(nodes,d=>d.id).join(en=>{const g=en.append("g").attr("class","nd");
   g.append("circle").attr("r",d=>d.hub?11:7).attr("fill",d=>CAT[d.g][1]);
   g.append("text").attr("class",d=>d.hub?"n hub":"n").attr("x",d=>d.hub?15:10).attr("y",4).text(d=>d.id);
   g.call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=Math.max(BY[d.e]+32,Math.min(BY[d.e]+BH[d.e]-12,e.y))}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));return g;});
 sim.nodes(nodes).force("link",d3.forceLink(links).distance(d=>d.k==="d"?60:d.k==="g"?85:110).strength(d=>d.k==="d"?0.5:d.k==="g"?0.12:0.03));
 sim.alpha(0.8).restart();
}
sim.on("tick",()=>{
 sim.nodes().forEach(d=>{d.x=Math.max(20,Math.min(W-150,d.x));d.y=Math.max(BY[d.e]+34,Math.min(BY[d.e]+BH[d.e]-12,d.y))});
 if(lsel)lsel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
 if(gsel)gsel.attr("transform",d=>`translate(${d.x},${d.y})`);
});
build();
</script>
</body>
</html>
