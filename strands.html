const DOM={o:["Occult & Theosophy","#5b2a86"],c:["Art & ideas","#c27a12"],m:["Stage magic","#7a5230"],a:["Light, film & AV","#2f6db5"]};
const EV={k:["Met or worked together","#1D9E75",""],w:["Saw it in person","#0e8fa0","10 6"],b:["Through a book","#8a8780","3 7"],j:["Joined their society","#8b5fb8","14 5 3 5"],m:["Modelled on it","#b07d3a","1 7"]};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let si=0,step=0,focus=null;
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080),st=$("stage");st.style.transform=`scale(${k})`;st.style.left=((innerWidth-1920*k)/2)+"px";st.style.top=((innerHeight-1080*k)/2)+"px";}
addEventListener("resize",fit);
$("pick").innerHTML=ST.map((c,i)=>`<option value="${i}">${i+1}. ${esc(c.t)}</option>`).join("");
$("legend").innerHTML=Object.values(EV).map(([t,c,da])=>`<span><svg width="38" height="12"><line x1="2" y1="6" x2="36" y2="6" stroke="${c}" stroke-width="4" stroke-dasharray="${da}" stroke-linecap="round"/></svg>${t}</span>`).join("")
 +`<span><i class="dash"></i>Precedent, no contact shown</span><span class="sep"></span>`+Object.values(DOM).map(([t,c])=>`<span><i style="background:${c}"></i>${t}</span>`).join("");
const srcs=k=>(k||[]).filter(x=>S[x]).map(x=>`<a href="${S[x][1]}" target="_blank" rel="noopener">${esc(S[x][0])}</a>`).join("");
let G={};
function geom(c){
 const L=Math.max(...c.n.map(d=>d.lane))+1,C=Math.max(...c.n.map(d=>d.col));
 const M=80,RW=270,RG=66,X1=M+RW+RG,R=1840-X1,GP=62,cw=Math.min(L>2?440:330,(R-(C-1)*GP)/C),tot=C*cw+(C-1)*GP,x0=X1+(R-tot)/2;
 const arcs=c.l.some(l=>{const s=c.n.find(d=>d.id===l[0]),t=c.n.find(d=>d.id===l[1]);return s&&t&&s.lane===t.lane&&s.lane===L-1&&L>1&&c.n.some(d=>d.lane===s.lane&&d.col>Math.min(s.col,t.col)&&d.col<Math.max(s.col,t.col));});
 const A=230,B=arcs?668:688,LG=L>2?28:42,ch=Math.min(262,(B-A-(L-1)*LG)/L),th=L*ch+(L-1)*LG,y0=A+(B-A-th)/2,rh=L>1?th:Math.max(th,318),ry=y0-(rh-th)/2;
 return {L,C,M,RW,cw,x0,ch,y0,th,rh,ry,LG,GP,colX:k=>x0+(k-1)*(cw+GP),laneY:l=>y0+l*(ch+LG)};}
function linkPath(c,l){
 const g=G,s=l[0]==="root"?null:c.n.find(d=>d.id===l[0]),t=c.n.find(d=>d.id===l[1]);
 const mid=d=>g.laneY(d.lane)+g.ch/2;
 if(!s){const y=mid(t),x1=g.M+g.RW+4,x2=g.colX(t.col)-6;return {d:`M${x1},${y} L${x2},${y}`,bx:(x1+x2)/2,by:y};}
 if(s.lane===t.lane){
  const y=mid(s),between=c.n.some(d=>d.lane===s.lane&&d.col>Math.min(s.col,t.col)&&d.col<Math.max(s.col,t.col));
  if(!between){const x1=g.colX(s.col)+g.cw+4,x2=g.colX(t.col)-6;return {d:`M${x1},${y} L${x2},${y}`,bx:(x1+x2)/2,by:y};}
  const below=s.lane===g.L-1&&g.L>1,yE=below?g.laneY(s.lane)+g.ch+4:g.laneY(s.lane)-4,dy=below?34:-34;
  const x1=g.colX(s.col)+g.cw*.72,x2=g.colX(t.col)+g.cw*.28;
  return {d:`M${x1},${yE} C${x1},${yE+dy*1.3} ${x2},${yE+dy*1.3} ${x2},${yE+(below?6:-6)}`,bx:(x1+x2)/2,by:yE+dy*.98};}
 if(s.col===t.col){const x=g.colX(s.col)+g.cw/2,dn=s.lane<t.lane,y1=dn?g.laneY(s.lane)+g.ch+4:g.laneY(s.lane)-4,y2=dn?g.laneY(t.lane)-6:g.laneY(t.lane)+g.ch+6;
  return {d:`M${x},${y1} L${x},${y2}`,bx:x,by:(y1+y2)/2};}
 const up=t.lane<s.lane,x1=g.colX(s.col)+g.cw-34,y1=up?g.laneY(s.lane)-4:g.laneY(s.lane)+g.ch+4,x2=g.colX(t.col)-6,y2=mid(t);
 return {d:`M${x1},${y1} C${x1},${y2} ${x1},${y2} ${x2},${y2}`,bx:x1,by:(y1+y2)/2+(up?8:-8)};}
function shown(c,i){return i<step;}
function linkShown(c,l){const ti=c.n.findIndex(d=>d.id===l[1]),fi=l[0]==="root"?-1:c.n.findIndex(d=>d.id===l[0]);return shown(c,ti)&&(fi<0||shown(c,fi));}
function panel(c){
 let f=focus;
 if(!f)f=step===0?{root:1}:(step>c.n.length?{all:1}:{node:step-1});
 if(f.all){return `<div class="pn" style="border-top-color:#c9c6bc"><div class="ev" style="color:#8a8780">The whole strand</div><div class="h">${c.l.length} link${c.l.length>1?"s":""}, ${c.n.length} steps</div><div class="tx" style="font-size:19px">Click a card or a numbered link to see its evidence and sources, or press ⟲ to step through from the start.</div></div>`;}
 if(f.root){const r=c.root;return `<div class="pn" style="border-top-color:${r.has?"#5b2a86":"#b9b6ab"}"><div class="ev" style="color:${r.has?"#5b2a86":"#7d7a72"}">${r.has?"Spiritualist root":"No Spiritualist root found"}${r.note?" · "+esc(r.note):""}</div><div class="h">${esc(r.nm)}${r.yr?" ("+esc(r.yr)+")":""}</div><div class="tx" style="font-size:19px">${esc(r.tx)}</div><div class="src">${srcs(r.src)}</div></div>`;}
 if(f.link!=null)return linkPanel(c,f.link);
 const d=c.n[f.node],inc=c.l.map((l,i)=>[l,i]).filter(([l])=>l[1]===d.id);
 if(inc.length){let h=inc.map(([l,i])=>linkPanel(c,i,d.src&&inc.length===1?d.src:null)).join("");return h;}

function linkPanel(c,i,extra){const l=c.l[i],[t,col]=EV[l[2]];
 return `<div class="pn" style="border-top-color:${col}"><div class="ev" style="color:${col}">${i+1} · ${t}</div><div class="h">${esc(l[3])}</div><div class="tx" style="font-size:19px">${esc(l[4])}</div><div class="src">${srcs(l[5])}${extra?`<span>· card:</span>`+srcs(extra):""}</div></div>`;}
function draw(){
 const c=ST[si],n=c.n.length;G=geom(c);const g=G,two=g.L>1,three=g.L>2,nfs=three?20:two?23:25,lfs=three?15.5:two?17:18,yfs=three?19:two?22:24;
 $("title").textContent=`${si+1} · ${c.t}`;$("q").textContent=c.q;$("count").textContent=`${si+1} of ${ST.length}`;$("pick").value=si;
 const r=c.root,rsel=focus&&focus.root?" sel":"";
 let h=`<div class="card root ${r.has?"has":"none"}${rsel}" data-r="1" style="left:${g.M}px;top:${g.ry}px;width:${g.RW}px;height:${g.rh}px">`
  +(r.has?`<div class="bar" style="background:#5b2a86;margin:0 -22px 14px"></div>`:"")
  +`<div class="rl">${r.has?"Spiritualist root":"No Spiritualist root found"}</div>${r.note?`<div class="nt">${esc(r.note)}</div>`:""}`
  +(r.yr?`<div class="yr" style="font-size:${yfs}px;color:#5b2a86">${esc(r.yr)}</div>`:"")
  +`<div class="nm" style="font-size:${two?24:25}px">${esc(r.nm)}</div><div class="ln" style="font-size:17px">${esc(r.tx)}</div></div>`;
 c.n.forEach((d,i)=>{const col=DOM[d.d][1],sel=focus&&focus.node===i?" sel":"";
  h+=`<div class="card${d.ctx?" ctx":""}${shown(c,i)?"":" dim"}${sel}" data-i="${i}" style="left:${g.colX(d.col)}px;top:${g.laneY(d.lane)}px;width:${g.cw}px;height:${g.ch}px">`
   +`<div class="bar" style="background:${col}${d.ctx?";opacity:.55":""}"></div><div class="hd"><div class="yr" style="font-size:${yfs}px;color:${col}">${esc(d.yr)}</div><div class="tag">${esc(d.tag)}</div></div>`
   +`<div class="nm" style="font-size:${nfs}px">${esc(d.nm)}</div><div class="ln" style="font-size:${lfs}px">${esc(d.ln)}</div></div>`;});
 $("cards").innerHTML=h;
 let svg="<defs>"+Object.entries(EV).map(([k,[t,col]])=>`<marker id="ah${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`).join("")+"</defs>";
 c.l.forEach((l,i)=>{const [t,col,da]=EV[l[2]],p=linkPath(c,l),op=linkShown(c,l)?1:0,sel=focus&&focus.link===i;
  svg+=`<g opacity="${op}" style="transition:opacity .35s"><path d="${p.d}" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="${da}" stroke-linecap="round" marker-end="url(#ah${l[2]})"/>`
   +`<g class="bd" data-l="${i}"><circle cx="${p.bx}" cy="${p.by}" r="${sel?19:16}" fill="${sel?col:"#fff"}" stroke="${col}" stroke-width="3"/><text x="${p.bx}" y="${p.by+6}" text-anchor="middle" font-size="17" font-weight="700" fill="${sel?"#fff":col}">${i+1}</text></g></g>`;});
 $("links").innerHTML=svg;
 $("panel").innerHTML=panel(c);
 $("verdict").innerHTML=c.v;$("verdict").className=step>=n?"":"hide";

 try{history.replaceState(null,"","#"+(si+1));}catch(e){}}
function setStrand(i,all){si=(i+ST.length)%ST.length;step=all?ST[si].n.length+1:0;focus=null;draw();}
function move(d){const n=ST[si].n.length;step=Math.max(0,Math.min(n,Math.min(step,n)+d));focus=null;draw();}

addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;

 else if(e.key==="f"||e.key==="F")full();});
