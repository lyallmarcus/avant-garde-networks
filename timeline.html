const W=1100,GUT=170,LW=184;
const ys=d3.scaleLinear().domain([1840,1860,1900,1945,1960,1975,1990,2000,2013]).range([70,270,510,1050,1320,1990,2260,2490,2770]);
const svg=d3.select("#tm");

function show(d){cap.innerHTML=`<strong>${d.t}</strong> — ${d.d}${d.pl?" · planned / unrealised":""}<br>${d.txt}`;LG.selectAll("path").classed("on",l=>l.a===d||l.b===d);}
function draw(){
 const ln=document.getElementById("linT").checked;
 LG.selectAll("path").data(links.filter(l=>ln&&vis(l.a)&&vis(l.b))).join("path").attr("class","lin").attr("d",pth);

   g.append("text").attr("class",d=>d.pl?"ev pl":"ev").attr("x",11).attr("y",4).text(d=>d.t);

 g.attr("transform",d=>`translate(${d.x},${d.y})`);
